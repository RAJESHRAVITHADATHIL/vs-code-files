<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rajesh Coding | Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 10% 16%, rgba(0, 229, 255, 0.78), transparent 27%),
        radial-gradient(circle at 90% 18%, rgba(255, 235, 59, 0.78), transparent 26%),
        radial-gradient(circle at 70% 88%, rgba(255, 64, 129, 0.76), transparent 30%),
        linear-gradient(135deg, #17153b 0%, #7b1fa2 42%, #ff6f00 100%);
    }
    header {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00e5ff, #ffeb3b 48%, #ff4081);
      color: #1b1238;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
      font-weight: 900;
    }
    nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-button {
      min-height: 44px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #191335;
      background: #ffffff;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }
    .nav-button:hover, .nav-button.active {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      background: #ffeb3b;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 54px 0 70px;
    }
    h1 {
      font-size: clamp(2.7rem, 7vw, 5.8rem);
      line-height: 0.96;
      margin-bottom: 18px;
      text-shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
    }
    p {
      max-width: 720px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.12rem;
      line-height: 1.7;
    }
    .gallery-grid {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .gallery-card {
      min-height: 230px;
      border-radius: 22px;
      padding: 22px;
      display: flex;
      align-items: flex-end;
      color: #1b1238;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9) 0 9%, transparent 10%),
        linear-gradient(135deg, var(--start), var(--end));
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.24);
      font-size: 1.25rem;
      font-weight: 900;
    }
    @media (max-width: 850px) {
      header { align-items: flex-start; flex-direction: column; }
      nav { justify-content: flex-start; }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">
      <span class="logo-mark">RC</span>
      <span>Rajesh Coding</span>
    </a>
    <nav aria-label="Main navigation">
      <a class="nav-button" href="index.html">Home</a>
      <a class="nav-button" href="about.html">About</a>
      <a class="nav-button active" href="gallery.html">Gallery</a>
      <a class="nav-button" href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Gallery</h1>
    <p>A colorful collection of sample design blocks for projects, photos, artwork, and creative ideas.</p>
    <div class="gallery-grid">
      <div class="gallery-card" style="--start:#ff4081;--end:#ffeb3b;">Project One</div>
      <div class="gallery-card" style="--start:#00e5ff;--end:#7c4dff;">Project Two</div>
      <div class="gallery-card" style="--start:#00c853;--end:#00e5ff;">Project Three</div>
      <div class="gallery-card" style="--start:#ff9100;--end:#f50057;">Project Four</div>
      <div class="gallery-card" style="--start:#64ffda;--end:#b388ff;">Project Five</div>
      <div class="gallery-card" style="--start:#ffff00;--end:#00c853;">Project Six</div>
    </div>
  </main>
</body>
</html>
