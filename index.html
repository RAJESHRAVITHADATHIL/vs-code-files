<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rajesh Coding | Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 213, 79, 0.8), transparent 26%),
        radial-gradient(circle at 88% 12%, rgba(0, 229, 255, 0.7), transparent 28%),
        radial-gradient(circle at 75% 82%, rgba(255, 64, 129, 0.78), transparent 30%),
        linear-gradient(135deg, #17153b 0%, #7b1fa2 43%, #ff6f00 100%);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00e5ff, #ffeb3b 48%, #ff4081);
      color: #1b1238;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-button,
    .hero-button {
      min-height: 44px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #191335;
      background: #ffffff;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .nav-button:hover,
    .hero-button:hover,
    .nav-button.active {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      background: #ffeb3b;
    }

    main {
      flex: 1;
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(290px, 0.95fr);
      align-items: center;
      gap: 42px;
      padding: 42px 0 70px;
    }

    .hero h1 {
      max-width: 780px;
      font-size: clamp(3rem, 8vw, 6.7rem);
      line-height: 0.92;
      letter-spacing: 0;
      text-shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
    }

    .hero p {
      margin-top: 24px;
      max-width: 590px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(1rem, 2vw, 1.28rem);
      line-height: 1.6;
    }

    .hero-actions {
      margin-top: 34px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-button.primary {
      color: #ffffff;
      background: linear-gradient(135deg, #00bcd4, #ff4081);
    }

    .hero-button.primary:hover {
      background: linear-gradient(135deg, #ff4081, #ffb300);
    }

    .showcase {
      position: relative;
      min-height: 470px;
    }

    .tile {
      position: absolute;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.42);
    }

    .tile.one {
      width: 66%;
      aspect-ratio: 1 / 1.08;
      top: 0;
      right: 0;
      background: linear-gradient(135deg, #00e5ff, #7c4dff 52%, #ff4081);
    }

    .tile.two {
      width: 48%;
      aspect-ratio: 1 / 1;
      left: 2%;
      top: 27%;
      background:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.28) 0 12px, transparent 12px 24px),
        linear-gradient(135deg, #ffeb3b, #ff6f00);
    }

    .tile.three {
      width: 54%;
      aspect-ratio: 1.3 / 1;
      right: 12%;
      bottom: 0;
      background:
        radial-gradient(circle at 30% 28%, #ffffff 0 8%, transparent 9%),
        radial-gradient(circle at 72% 60%, #ffffff 0 7%, transparent 8%),
        linear-gradient(135deg, #00c853, #00e5ff);
    }

    .tile-label {
      position: absolute;
      left: 18px;
      bottom: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      color: #1c1237;
      background: rgba(255, 255, 255, 0.88);
      font-size: 0.92rem;
      font-weight: 800;
    }

    @media (max-width: 800px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        justify-content: flex-start;
      }

      main {
        grid-template-columns: 1fr;
        padding-top: 24px;
      }

      .showcase {
        min-height: 350px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="index.html">
        <span class="logo-mark">RC</span>
        <span>Rajesh Coding</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="nav-button active" href="index.html">Home</a>
        <a class="nav-button" href="about.html">About</a>
        <a class="nav-button" href="gallery.html">Gallery</a>
        <a class="nav-button" href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <div class="hero">
        <h1>Colorful ideas, beautifully coded.</h1>
        <p>
          Welcome to a vibrant creative space for web pages, visual designs,
          project galleries, and friendly collaboration.
        </p>
        <div class="hero-actions">
          <a class="hero-button primary" href="gallery.html">View Gallery</a>
          <a class="hero-button" href="contact.html">Contact Us</a>
        </div>
      </div>

      <div class="showcase" aria-label="Abstract gallery preview">
        <div class="tile one"><span class="tile-label">Design</span></div>
        <div class="tile two"><span class="tile-label">Code</span></div>
        <div class="tile three"><span class="tile-label">Create</span></div>
      </div>
    </main>
  </div>
</body>
</html>
